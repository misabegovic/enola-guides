      - "CharacterDataUndefined"
      - "CharacterName"
      - "Class"
      - "ClassCastException"
      - "ClassCircularityError"
      - "ClassFormatError"
      - "ClassFrameInfo"
      - "ClassLoader"
      - "ClassNotFoundException"
      - "ClassValue"
      - "CloneNotSupportedException"
      - "Cloneable"
      - "Comparable"
      - "ConditionalSpecialCasing"
      - "Deprecated"
      - "Double"
      - "Enum"
      - "EnumConstantNotPresentException"
