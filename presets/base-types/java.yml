# java: explain's base-type preset for tabula, kept here and read by tabula explain (not the law presets the guides describe).
# Read once as text from the source below, never by loading a runtime. Names are sorted.
stack: java
languages:
  - java
lists:
  - kind: library
    release: "jdk-25-ga"
    source: "OpenJDK java.base java/lang"
    roots:
      - "java."
      - "javax."
      - "jdk."
    names:
      - "AbstractMethodError"
      - "AbstractStringBuilder"
      - "Appendable"
      - "ApplicationShutdownHooks"
      - "ArithmeticException"
      - "ArrayIndexOutOfBoundsException"
      - "ArrayStoreException"
      - "AssertionError"
      - "AssertionStatusDirectives"
