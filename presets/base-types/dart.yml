# dart: explain's base-type preset for tabula, kept here and read by tabula explain (not the law presets the guides describe).
# Read once as text from the source below, never by loading a runtime. Names are sorted.
stack: dart
languages:
  - dart
lists:
  - kind: library
    release: "Dart SDK 3.13.7"
    source: "sdk/lib/core"
    names:
      - "ArgumentError"
      - "AssertionError"
      - "BigInt"
      - "Comparable"
      - "Comparator"
      - "ConcurrentModificationError"
      - "DateTime"
      - "Deprecated"
      - "Duration"
      - "Enum"
      - "Error"
      - "Exception"
      - "Expando"
      - "Finalizer"
      - "FormatException"
      - "Function"
      - "IndexError"
      - "IntegerDivisionByZeroException"
      - "Invocation"
      - "Iterable"
      - "Iterator"
      - "List"
      - "Map"
      - "MapEntry"
      - "Match"
      - "NoSuchMethodError"
      - "Null"
      - "Object"
      - "OutOfMemoryError"
      - "Pattern"
      - "RangeError"
      - "Record"
      - "RegExp"
      - "RegExpMatch"
      - "RuneIterator"
      - "Runes"
      - "Set"
      - "Sink"
      - "StackOverflowError"
      - "StackTrace"
      - "StateError"
      - "Stopwatch"
      - "String"
      - "StringBuffer"
      - "StringSink"
      - "Symbol"
      - "Type"
      - "TypeError"
      - "UnimplementedError"
      - "UnsupportedError"
      - "Uri"
      - "UriData"
      - "WeakReference"
test_paths:
  describe:
    - "directory test"
    - "files *_test.dart"
  directories:
    - "test"
  name_suffixes:
    - "_test.dart"
