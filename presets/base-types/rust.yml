# rust: explain's base-type preset for tabula, kept here and read by tabula explain (not the law presets the guides describe).
# Rust's standard library and serde traits, matched by the last segment of a written name.
stack: rust
languages:
  - rust
lists:
  - kind: framework
    release: "not recorded"
    source: "transcribed from tabula src/explain.rs and src/families.rs at c070511, where the release the list was read from was not recorded"
    names:
      - "Default"
      - "Display"
      - "Debug"
      - "FromStr"
      - "From"
      - "Into"
      - "TryFrom"
      - "TryInto"
      - "Iterator"
      - "IntoIterator"
      - "DoubleEndedIterator"
      - "ExactSizeIterator"
      - "FromIterator"
      - "Extend"
      - "Error"
      - "Clone"
      - "Copy"
      - "PartialEq"
      - "Eq"
      - "PartialOrd"
      - "Ord"
      - "Hash"
      - "Drop"
      - "Deref"
      - "DerefMut"
      - "AsRef"
      - "AsMut"
      - "Borrow"
      - "ToString"
      - "Write"
      - "Read"
      - "Send"
      - "Sync"
      - "Future"
      - "Add"
      - "Sub"
      - "Mul"
      - "Div"
      - "Neg"
      - "Not"
      - "Index"
      - "IndexMut"
      - "Serialize"
      - "Deserialize"
      - "Serializer"
      - "Deserializer"
      - "Visitor"
