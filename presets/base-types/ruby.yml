    release: "rbs 4.0.2"
    source: "every class and module the core and stdlib signature files of rbs 4.0.2 declare, parsed as text, never by loading the gem (nesting followed, interfaces and names starting with _ skipped, a class X = Y alias opening no block, a leading :: absolute)"
