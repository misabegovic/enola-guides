[package]
name = "enola-guides"
version = "0.8.0"
edition = "2021"
rust-version = "1.70"
description = "The enola guides, examples, laws, skills, hooks, recipes and templates, listed, shown and copied from one command"
license = "Apache-2.0"
repository = "https://github.com/misabegovic/enola-guides"
homepage = "https://github.com/misabegovic/enola-guides"
readme = "README.md"
keywords = ["architecture", "enola", "constraints", "guides", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "bundle.json", "README.md", "LICENSE", "NOTICE"]

[[bin]]
name = "enola-guides"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
