# Publishes one version everywhere when a tag vX.Y.Z is pushed: RubyGems, npm,
# PyPI, crates.io, the Go module proxy, a GitHub release carrying the Go
# binaries, and the Homebrew tap. Every registry is reached through trusted
# publishing (OIDC), never a stored token, except the tap, which is a git push.
# The one-time setup on each registry is in RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The tag names the version
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: astral-sh/setup-uv@v6
      - name: Build every package
        run: |
          uv venv /tmp/venv && uv pip install --python /tmp/venv/bin/python build
          PYTHON=/tmp/venv/bin/python script/build-packages
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  rubygems:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: gem push dist/enola-guides-*.gem

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish ./dist/enola-guides-*.tgz --access public --provenance

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Keep only the Python distributions
        run: mkdir pypi && mv dist/*.whl dist/enola_guides-*.tar.gz pypi/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/

  crates:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Put the bundle, LICENSE and NOTICE in the crate
        run: cp bundle/bundle.json LICENSE NOTICE packages/rust/
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --allow-dirty --manifest-path packages/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release with the Go binaries and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "${GITHUB_REF_NAME#v}" --notes "$notes" --verify-tag
      - name: Ask the Go module proxy for the new version
        run: curl -fsS "https://proxy.golang.org/github.com/misabegovic/enola-guides/@v/${GITHUB_REF_NAME}.info"

  homebrew:
    needs: github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Write the formula for this tag and push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha=$(curl -fsSL "https://github.com/misabegovic/enola-guides/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d ' ' -f 1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/misabegovic/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/${version}/" -e "s/@SHA256@/${sha}/" packaging/homebrew/enola-guides.rb.in > tap/Formula/enola-guides.rb
          cd tap
          git config user.name "enola-guides release"
          git config user.email "noreply@github.com"
          git add Formula/enola-guides.rb
          git commit -m "enola-guides ${version}"
          git push
