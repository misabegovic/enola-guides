# One-time setup before this can run: register a pending trusted publisher at
# https://rubygems.org/settings/pending_trusted_publishers for enola-guides,
# pointing at owner misabegovic, repository enola-guides, workflow release.yml.
# Leave the environment field blank there, or add a matching `environment:` to
# the job below. No API token is involved at any point.
name: Release

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Show the OIDC claims RubyGems matches on
        run: |
          set -euo pipefail
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" > /tmp/oidc.json
          python3 - <<'PY'
          import base64, json
          token = json.load(open("/tmp/oidc.json"))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("repository", "repository_owner", "workflow_ref", "job_workflow_ref", "environment", "ref"):
              print(f"{key}: {claims.get(key)!r}")
          PY

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build and push
        run: |
          set -euo pipefail
          mkdir -p pkg
          gem build enola-guides.gemspec -o pkg/enola-guides.gem
          gem push pkg/enola-guides.gem
