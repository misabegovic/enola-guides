# Publishes one version everywhere when a tag vX.Y.Z is pushed: RubyGems, npm,
# PyPI, crates.io, the Go module proxy, a GitHub release carrying the Go
# binaries, and the Homebrew tap. Every registry is reached through trusted
# publishing (OIDC), never a stored token, except the tap, which is a git push.
# The one-time setup on each registry is in RELEASING.md. A version a registry
# already has is skipped, not republished, so a tag whose first versions went
# out by hand, or a run re-run after a partial failure, ends green.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The tag names the version
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: astral-sh/setup-uv@v6
      - name: Build every package
        run: |
          uv venv /tmp/venv && uv pip install --python /tmp/venv/bin/python build
          PYTHON=/tmp/venv/bin/python script/build-packages
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  rubygems:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Is this version on RubyGems already?
        id: seen
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/enola-guides/versions/${GITHUB_REF_NAME#v}.json")
          if [ "$code" = 200 ]; then echo "::notice::enola-guides ${GITHUB_REF_NAME#v} is on RubyGems already; skipped"; echo "published=true" >> "$GITHUB_OUTPUT"; fi
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        if: steps.seen.outputs.published != 'true'
      - if: steps.seen.outputs.published != 'true'
        run: gem push dist/enola-guides-*.gem

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Is this version on npm already?
        id: seen
        run: |
          if [ "$(npm view "enola-guides@${GITHUB_REF_NAME#v}" version 2>/dev/null)" = "${GITHUB_REF_NAME#v}" ]; then echo "::notice::enola-guides ${GITHUB_REF_NAME#v} is on npm already; skipped"; echo "published=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.seen.outputs.published != 'true'
        run: npm publish ./dist/enola-guides-*.tgz --access public --provenance

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Keep only the Python distributions
        run: mkdir pypi && mv dist/*.whl dist/enola_guides-*.tar.gz pypi/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/
          skip-existing: true

  crates:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Put the bundle, LICENSE and NOTICE in the crate
        run: cp bundle/bundle.json LICENSE NOTICE packages/rust/
      - name: Is this version on crates.io already?
        id: seen
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "enola-guides release (github.com/${GITHUB_REPOSITORY})" "https://crates.io/api/v1/crates/enola-guides/${GITHUB_REF_NAME#v}")
          if [ "$code" = 200 ]; then echo "::notice::enola-guides ${GITHUB_REF_NAME#v} is on crates.io already; skipped"; echo "published=true" >> "$GITHUB_OUTPUT"; fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.seen.outputs.published != 'true'
        id: auth
      - if: steps.seen.outputs.published != 'true'
        run: cargo publish --allow-dirty --manifest-path packages/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Release with the Go binaries and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::notice::the release $GITHUB_REF_NAME exists already; skipped"
            exit 0
          fi
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "${GITHUB_REF_NAME#v}" --notes "$notes" --verify-tag
      - name: Ask the Go module proxy for the new version
        run: curl -fsS "https://proxy.golang.org/github.com/misabegovic/enola-guides/@v/${GITHUB_REF_NAME}.info"

  homebrew:
    needs: github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Write the formula for this tag and push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha=$(curl -fsSL "https://github.com/misabegovic/enola-guides/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d ' ' -f 1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/misabegovic/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/${version}/" -e "s/@SHA256@/${sha}/" packaging/homebrew/enola-guides.rb.in > tap/Formula/enola-guides.rb
          cd tap
          git config user.name "enola-guides release"
          git config user.email "noreply@github.com"
          git add Formula/enola-guides.rb
          if git diff --cached --quiet; then
            echo "::notice::the tap has enola-guides ${version} already; skipped"
            exit 0
          fi
          git commit -m "enola-guides ${version}"
          git push
