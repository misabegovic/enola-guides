name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  examples:
    name: Examples lint against the pinned enola
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: script/lint-examples

  clis:
    name: Every package's command gives the same output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: astral-sh/setup-uv@v6
      - run: script/bundle --check
      - run: script/sync-version --check
      - run: go vet ./... && test -z "$(gofmt -l cmd bundle)"
      - name: Build every package
        run: |
          uv venv /tmp/venv && uv pip install --python /tmp/venv/bin/python build
          PYTHON=/tmp/venv/bin/python script/build-packages
      - name: Install each package and run the shared cases
        run: |
          set -euo pipefail
          w=$(mktemp -d)
          v=$(cat VERSION)
          GEM_HOME=$w/gem gem install --local --no-document dist/enola-guides-$v.gem
          npm install -g --prefix $w/npm ./dist/enola-guides-$v.tgz
          uv venv $w/py && uv pip install --python $w/py/bin/python dist/enola_guides-$v-py3-none-any.whl
          mkdir $w/crate && tar -xzf dist/enola-guides-$v.crate -C $w/crate
          (cd $w/crate/enola-guides-$v && cargo build --release --locked)
          mkdir $w/go && tar -xzf dist/enola-guides-$v-linux-amd64.tar.gz -C $w/go
          script/test-clis \
            gem="env GEM_HOME=$w/gem $w/gem/bin/enola-guides" \
            npm="$w/npm/bin/enola-guides" \
            pypi="$w/py/bin/enola-guides" \
            crate="$w/crate/enola-guides-$v/target/release/enola-guides" \
            go="$w/go/enola-guides-$v-linux-amd64/enola-guides"

  homebrew:
    name: The Homebrew formula builds and passes its test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the formula from a local tap, built from this checkout
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          git archive --format=tar.gz --prefix=enola-guides/ -o /tmp/enola-guides.tar.gz HEAD
          sha=$(sha256sum /tmp/enola-guides.tar.gz | cut -d ' ' -f 1)
          brew tap-new --no-git local/test
          sed -e "s/@VERSION@/$(cat VERSION)/" -e "s/@SHA256@/$sha/" \
              -e 's|url "https://github.com/misabegovic/enola-guides/archive/refs/tags/v.*\.tar\.gz"|url "file:///tmp/enola-guides.tar.gz"\n  version "'"$(cat VERSION)"'"|' \
              packaging/homebrew/enola-guides.rb.in > "$(brew --repository local/test)/Formula/enola-guides.rb"
          brew install --build-from-source local/test/enola-guides
          brew test local/test/enola-guides

  example-laws:
    name: Each worked example breaks exactly the laws it says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: script/test-examples

  check-template:
    name: The check template grades a fixture end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: script/test-check-template

  hooks:
    name: The hook templates gate, record and block as guide 10 says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: script/test-hooks

  kb:
    name: The knowledge base's wrapper runs against its example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: script/test-kb

  links:
    name: Relative links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: script/check-links

  gem:
    name: The gem builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem build enola-guides.gemspec

  action-recipe:
    name: The enola-action recipes in guide 05 run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guide 05 pins the version in ENOLA_VERSION
        id: pin
        run: |
          v=$(cat ENOLA_VERSION)
          grep -q "version: $v" guides/05-constraints-in-ci.md
          grep -q "v=$v;" guides/05-constraints-in-ci.md
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - id: pinned
        uses: enola-labs/enola-action@v2
        with:
          version: ${{ steps.pin.outputs.version }}
          fail-on: constraints
          warn-only: true
      - name: Install enola and the Rubydex library it pins
        env:
          V: ${{ steps.pin.outputs.version }}
        run: |
          a=enola-$V-linux-amd64
          curl -fsSLO "https://github.com/enola-labs/enola/releases/download/v$V/$a.tar.gz"
          curl -fsSLO "https://github.com/enola-labs/enola/releases/download/v$V/$a.sha256"
          sha256sum -c "$a.sha256"
          tar -xzf "$a.tar.gz"
          mkdir -p "$RUNNER_TEMP/enola" && mv "$a" "$RUNNER_TEMP/enola/enola"
          "$RUNNER_TEMP/enola/enola" providers fetch rubydex
          rm "$a.tar.gz" "$a.sha256"
      - id: ruby
        uses: enola-labs/enola-action@v2
        with:
          binary: ${{ runner.temp }}/enola/enola
          fail-on: constraints
          warn-only: true
      - name: Each produced a verdict
        env:
          PINNED: ${{ steps.pinned.outputs.status }}
          RUBY: ${{ steps.ruby.outputs.status }}
        run: |
          echo "pinned: $PINNED, with rubydex: $RUBY"
          for s in "$PINNED" "$RUBY"; do
            case "$s" in clean|partial_clean|regression|partial_regression) ;; *) exit 1 ;; esac
          done
