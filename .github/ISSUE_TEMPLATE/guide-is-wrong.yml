name: A guide is wrong
description: A command, flag, key or output a guide shows does not do what it says
labels: ["guide"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The guide and the line, or the example
      placeholder: guides/07-providers.md:40
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran and what you got
      description: The command and its output, pasted
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: enola --version
    validations:
      required: true
